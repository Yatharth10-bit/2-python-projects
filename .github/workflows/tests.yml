name: Test both projects
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: SeatRace tests
        run: python -m unittest discover -s seat-race -v
      - name: Transit Cut tests
        run: python -m unittest discover -s transit-cut -v
