<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img">
<title>Directed transit links and reachable stops after closure</title>
<rect width="900" height="490" rx="18" fill="#101d30"/>
<g font-family="system-ui, sans-serif" fill="#e6f0fa">
<text x="32" y="49" font-size="30" font-weight="bold">Transit Cut</text>
<text x="32" y="81" font-size="16">Synthetic demo · Closed: GREEN</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#aab9ca"/></marker></defs>
<line x1="88.0" y1="260.0" x2="214.0" y2="260.0" stroke="#66d3c0" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="235.8" y1="257.9" x2="362.3" y2="231.5" stroke="#fc9b9b" stroke-dasharray="5 4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="235.8" y1="262.1" x2="362.3" y2="288.5" stroke="#66d3c0" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="384.0" y1="229.0" x2="510.0" y2="229.0" stroke="#fc9b9b" stroke-dasharray="5 4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="384.0" y1="291.0" x2="510.0" y2="291.0" stroke="#66d3c0" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="512.8" y1="287.1" x2="385.1" y2="233.6" stroke="#66d3c0" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="78" cy="260.0" r="8" fill="#66d3c0"><title>Library</title></circle><text x="78" y="283.0" text-anchor="middle" font-size="13">Library</text>
<circle cx="226" cy="260.0" r="8" fill="#66d3c0"><title>Clock Tower</title></circle><text x="226" y="283.0" text-anchor="middle" font-size="13">Clock Tower</text>
<circle cx="374" cy="229.0" r="8" fill="#f6ca82"><title>West Gate</title></circle><text x="374" y="252.0" text-anchor="middle" font-size="13">West Gate</text>
<circle cx="374" cy="291.0" r="8" fill="#66d3c0"><title>Market</title></circle><text x="374" y="314.0" text-anchor="middle" font-size="13">Market</text>
<circle cx="522" cy="229.0" r="8" fill="#fc9b9b"><title>Observatory</title></circle><text x="522" y="252.0" text-anchor="middle" font-size="13">Observatory</text>
<circle cx="522" cy="291.0" r="8" fill="#66d3c0"><title>Lake Walk</title></circle><text x="522" y="314.0" text-anchor="middle" font-size="13">Lake Walk</text>
<text x="32" y="429" font-size="15">Teal = reachable · Gold = longer path · Pink = disconnected · Dashed = closed link</text>
<text x="32" y="460" font-size="14" fill="#b5c8da">Showing 6 of 6 initially reachable stops including origin. Columns show pre-closure hop distance.</text>
</g></svg>